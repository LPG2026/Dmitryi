<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний LPG</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="apple-touch-icon" href="./logo.svg">
<meta name="theme-color" content="#0b5394">
<style>
  body { margin:0; background:#eef3f8; font-family:Arial,sans-serif; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; padding:20px; box-sizing:border-box; }
  img { width:150px; height:150px; background:#fff; border-radius:30px;
        box-shadow:0 4px 14px rgba(0,0,0,.15); padding:12px; box-sizing:border-box; }
  h1 { font-size:20px; margin:18px 0 4px; color:#17252f; }
  div.hint { color:#6b7a86; font-size:13px; text-align:center; margin-bottom:22px; max-width:320px; }
  a.open { display:block; width:100%; max-width:320px; background:#0b5394; color:#fff; text-align:center;
           text-decoration:none; padding:14px 0; border-radius:12px; font-size:17px; }
</style>
</head>
<body>
<img src="./logo.svg" alt="LPG">
<h1>База знаний LPG</h1>
<div class="hint">Тесты и чек-листы АГЗС / АЗС / Мойка<br>Вход только для номеров из списка предприятия<br><br>
Меню браузера (<b>⋮</b>) → <b>«Установить приложение»</b></div>
<a class="open" id="openbtn" href="#">Открыть приложение</a>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyhvDaXwkcOttVPUXMgIYeudvoPmSzsRZkJiZjSK_aN8dijRB8NTUc8lLNxIJIZQBQK/exec";
document.getElementById('openbtn').href = EXEC;
if (location.search.indexOf("open=1") !== -1 ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches)) {
  location.replace(EXEC);
}
</script>
</body>
</html>
