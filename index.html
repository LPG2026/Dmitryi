<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний LPG</title>
<link rel="icon" id="fav">
<link rel="apple-touch-icon" id="appleicon">
<link rel="manifest" id="mfst">
<meta name="theme-color" content="#0b5394">
<style>
  body { margin:0; background:#eef3f8; font-family:Arial,sans-serif; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; padding:20px; box-sizing:border-box; }
  img { width:150px; height:150px; background:#fff; border-radius:30px;
        box-shadow:0 4px 14px rgba(0,0,0,.15); padding:12px; box-sizing:border-box; }
  h1 { font-size:20px; margin:18px 0 4px; color:#17252f; }
  div.hint { color:#6b7a86; font-size:13px; text-align:center; margin-bottom:22px; max-width:320px; }
  a.open { display:block; width:100%; max-width:320px; background:#0b5394; color:#fff; text-align:center;
           text-decoration:none; padding:14px 0; border-radius:12px; font-size:17px; }
</style>
</head>
<body>
<img id="logo" alt="LPG">
<h1>База знаний LPG</h1>
<div class="hint">Тесты и чек-листы АГЗС / АЗС / Мойка<br>Вход только для номеров из списка предприятия<br><br>
Меню браузера (<b>⋮</b>) → <b>«Установить приложение»</b></div>
<a class="open" id="openbtn" href="#">Открыть приложение</a>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyhvDaXwkcOttVPUXMgIYeudvoPmSzsRZkJiZjSK_aN8dijRB8NTUc8lLNxIJIZQBQK/exec";
var LOGO_SVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='#ffffff'/><text x='96' y='56' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>LPG</text><path d='M42 68 H150 V102 L96 128 L42 102 Z' fill='#e32219' stroke='#e32219' stroke-width='10' stroke-linejoin='round'/><path d='M42 122 L96 148 L150 122 V148 L96 174 L42 148 Z' fill='#1ba0e2' stroke='#1ba0e2' stroke-width='10' stroke-linejoin='round'/></svg>";
var ICON = "data:image/svg+xml," + encodeURIComponent(LOGO_SVG);
document.getElementById('logo').src = ICON;
document.getElementById('fav').href = ICON;
document.getElementById('appleicon').href = ICON;
document.getElementById('openbtn').href = EXEC;
var mf = {
  name: "База знаний LPG",
  short_name: "LPG База",
  start_url: "./index.html?open=1",
  scope: "./",
  display: "standalone",
  background_color: "#eef3f8",
  theme_color: "#0b5394",
  icons: [
    {src: ICON, sizes: "192x192", type: "image/svg+xml", purpose: "any"},
    {src: ICON, sizes: "512x512", type: "image/svg+xml", purpose: "any"}
  ]
};
document.getElementById('mfst').href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type: "application/manifest+json"}));
if (location.search.indexOf("open=1") !== -1 ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches)) {
  location.replace(EXEC);
}
</script>
</body>
</html>
